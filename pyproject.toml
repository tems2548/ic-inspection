[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icinspect"
version = "0.1.0"
description = "IC inspection: PatchCore anomaly detection (anomalib) + CRNN/CTC marking OCR"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy",
  "pillow",
  "pyyaml",
]

[project.optional-dependencies]
train = ["anomalib>=2.0", "torch>=2.7", "torchvision>=0.22", "matplotlib"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ic-inspect = "icinspect.pipeline:main"
ic-inspect-gui = "icinspect.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["slow: longer-running smoke tests (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 110
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
